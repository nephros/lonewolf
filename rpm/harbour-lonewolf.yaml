Name: harbour-lonewolf
Summary: A role-playing choose-your-own-adventure game
# harbour only accepts three digits.
# 0.1.1 is upstream, so we use a datestamp for patch:
# Remember to adjust the lw_minver macro if necessary
Version: 0.1.260901
Release: 0
Group: Applications
License: GPLv3 and OFL
URL: https://github.com/nephros/lonewolf
SCM: https://github.com/nephros/lonewolf
Sources:
    - '%{name}-%{version}.tar.gz'
    - lonewolf-app-icon.svg
    - '%{name}.profile'
    - Alegreya-Medium.otf
    - Alegreya-Regular.otf
    - savescumming.sh
#SetupOptions: -q -n %{name}-%{version}/upstream
Macros:
  # 'appname;lonewolf'
  # 'orgname;lonewolf'
  - 'pkgname;%{name}'
  - 'lw_minver;0.1.250729' # incompatible changes
  - plugindir;%{_datadir}/%{name}/
  # plugindir;%{_libdir}/qt5/qml
  - '__requires_exclude_from;^%{_datadir}/%{name}/_cheat/.*\.sh$'
  - '__provides_exclude;^(font|qml).*$'
  - '__provides_exclude_from;%{plugindir}'
  # |
  # please;ignore this macro
#Macros2:
#  - |
#    please_also;ignore this macro
#    %if 0%{?sailfishos_version} < 40600
#    %if 0%{?sailfishos_version} <= 40001
#    %define cmake_build %__cmake --build "."
#    %define cmake_install %make_install
#    %else
#    %define cmake_build %__cmake --build "." -j8 --verbose
#    %define cmake_install DESTDIR=%buildroot %__cmake --install .
#    %endif
#    %endif
Macros2:
  - |
    please_also;ignore this macro
    %if %{with harbour}
    %undefine vendor
    %undefine _vendor
    %undefine _chum
    %endif
    %if 0%{?harbour_validation:1}
    BuildRequires: sdk-harbour-rpmvalidator
    %endif

Check: true # so we can do a fake clean section below it:

Description: |
    %{summary}.

    Lone Wolf is a role-playing book series from the 80s.

    You are the sole survivor of a devastating attack on the monastery where
    you were learning the skills of the Kai Lords. You swear vengeance on the
    Darklords for the massacre of the Kai warriors, and with a sudden flash of
    insight you know what you must do. You must set off on a perilous journey
    to the capital city to warn the King of the terrible threat that faces his
    people: For you are now the last of the Kai.

    You are now Lone Wolf.

    This App is a port of Tim Süberkrüb's Qt/QML version, which is a port of
    the original Lone Wolf app for Ubuntu Phone by Michael Terry.

    %if 0%{?_chum}
    Title: Lonewolf
    Type: desktop-application
    DeveloperName: Peter G., Tim Süberkrüb, Michael Terry
    PackagedBy: nephros
    Categories:
     - Games
    Custom:
      Repo: https://github.com/nephros/lonewolf
    PackageIcon: %{url}/raw/sfos/rpm/lonewolf-app-icon.svg
    Screenshots:
      - %{url}/raw/sfos/Screenshot_001.jpg
      - %{url}/raw/sfos/Screenshot_002.jpg
    Links:
      Help: https://www.projectaon.org/en/ReadersHandbook/Home
    %endif

Requires:
  - libsailfishapp-launcher
  # qt5-qtdeclarative-import-Lonewolf
PkgBR:
  - sailfish-svg2png
  - qml-rpm-macros
  - cmake
  - gettext
  - intltool
  # check package in clean step
PkgConfigBR:
  - Qt5Core
  - Qt5Qml
  - Qt5Quick
  - Qt5XmlPatterns
  - sailfishapp
  - glesv2
  - icu-i18n
  - libxml-2.0
Configure: cmake
Builder: cmake
ConfigOptions:
  # '-Wno-dev'
  # '--trace'
  - --debug-find
  - --debug-trycompile
  - '-DQT_IMPORTS_DIR=%{plugindir}'
  - '-DINSTALL_TESTS=off'
  - '-DCLICK_MODE=off'
NoIconCache: true
NoAutoLocale: true
#BuildArch: noarch
Files:
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/icons/*/*/apps/*'
  - '%{_datadir}/%{name}'
  - '%exclude %{_datadir}/%{name}/qml/TTS.qml'

SubPackages:
    - Name:  tts-plugin
      Summary: Text-to-Speech support for %{name}
      Group: Games
      AutoDepend: false
      Requires:
        - harbour-dsnote >= 4.7.0
        - '%{name} >= %{lw_minver}' #0.1.250727' # since 0.1.250727_pre1
      Description: |
          Adds text-to-speech support to the Lone Wolf app from Jolla Store (Harbour).

          Requires the excellent Speech Note (harbour-dsnote) by mkiol.
          This means you have to have the Openrepos (Storeman) mkiol repo enabled in
          order to install this.

          The plugin will use engine and settings configured for English (in Speech Note settings).

          %if "0%{?_chum}"
          Title: TTS plugin for Lone Wolf
          Type: desktop-application
          Categories:
           - Games
          PackageIcon: %{url}/raw/sfos/rpm/lonewolf-app-icon.svg
          Screenshots:
           - https://github.com/nephros/harbour-lonewolf/raw/sfos/Screenshot_004.jpg
          %endif
      BuildArch: noarch
      Files:
        - '%{_datadir}/%{name}/qml/TTS.qml'
        - '%config %{_sysconfdir}/sailjail/permissions/%{name}.profile'


