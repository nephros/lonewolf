Name: lonewolf
Summary: A role-playing choose-your-own-adventure game
# 0.1.1 is upstream, fourth digit is SFOS version
Version: 0.1.1.9
Release: 0
Group: Applications
License: GPLv3 and OFL
URL: https://github.com/nephros/lonewolf
SCM: https://github.com/nephros/lonewolf
Sources:
    - '%{name}-%{version}.tar.gz'
    - lonewolf-app-icon.svg
    - lonewolf.profile
    - Alegreya-Medium.otf
    - Alegreya-Regular.otf
#SetupOptions: -q -n %{name}-%{version}/upstream
Macros:
  - 'orgname;%{name}'
  - 'appname;%{name}'
  - 'pkgname;%{name}'
  - '__provides_exclude;^font..lang=.*$'
  - '__requires_exclude_from;%{plugindir}'
  - 'plugindir;%{_libdir}/qt5/qml/Lonewolf/'
  # for harbour:
  # 'plugindir;%{_datadir}/%{name}/qml/plugins/LoneWolf'
Macros2:
  - |
    please_ignore;this macro
    %if 0%{?sailfishos_version} < 40600
    %define cmake_build %__cmake --build "." -j8 --verbose
    %define cmake_install DESTDIR=%buildroot %__cmake --install .
    %endif
Description: |
    %{summary}.

    Lone Wolf is a role-playing book series from the 80s.

    You are the sole survivor of a devastating attack on the monastery where
    you were learning the skills of the Kai Lords. You swear vengeance on the
    Darklords for the massacre of the Kai warriors, and with a sudden flash of
    insight you know what you must do. You must set off on a perilous journey
    to the capital city to warn the King of the terrible threat that faces his
    people: For you are now the last of the Kai.

    You are now Lone Wolf.

    This App is a port of Tim Süberkrüb's Qt/QML version, which is a port of
    the original Lone Wolf app for Ubuntu Phone by Michael Terry.

    %if "0%{?_chum}"
    Title: Lonewolf
    Type: desktop-application
    DeveloperName: Peter G., Tim Süberkrüb, Michael Terry
    PackagedBy: nephros
    Categories:
     - Games
    Custom:
      Repo: https://github.com/nephros/lonewolf
    PackageIcon: %{url}/raw/sfos/rpm/lonewolf-app-icon.svg
    Screenshots:
      - %{url}/raw/sfos/Screenshot_001.jpg
      - %{url}/raw/sfos/Screenshot_002.jpg
    Links:
      Help: https://www.projectaon.org/en/ReadersHandbook/Home
    %endif

Requires:
  - libsailfishapp-launcher
  # qt5-qtdeclarative-import-Lonewolf
PkgBR:
  - sailfish-svg2png
  - qml-rpm-macros
  - cmake
  - gettext
  - intltool
PkgConfigBR:
  - Qt5Core
  - Qt5Qml
  - Qt5Quick
  - Qt5XmlPatterns
  - sailfishapp
  - glesv2
  - icu-i18n
  - libxml-2.0
Configure: cmake
Builder: cmake
ConfigOptions:
  - '-DQT_IMPORTS_DIR=%{plugindir}'
  - '-DLONEWOLF_DIR=%{_datadir}/%{name}'
  - '-DINSTALL_TESTS=off'
  - '-DCLICK_MODE=off'
NoIconCache: true
NoAutoLocale: true
#BuildArch: noarch
Files:
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/icons/*/*/apps/%{name}.png'
  - '%{_datadir}/icons/*/*/apps/%{name}.svg'
  - '%{_datadir}/%{name}'
  - '%dir %{_datadir}/fonts/%{name}'
  - '%{_datadir}/fonts/%{name}/*'
  - '%exclude %{_datadir}/%{name}/qml/TTS.qml'

SubPackages:
    - Name:  qt5-qtdeclarative-import-Lonewolf
      AsWholeName: true
      AutoDepend: false
      Summary: Lonewolf player QML plugin
      Group: Libraries
      Files:
        - '%{plugindir}'

    - Name:  tts-plugin
      Summary: Text-to-Speech support for %{name}
      Group: Games
      Requires:
        - harbour-dsnote >= 4.7.0
      Description: |
          Adds text-to-speech support to the Lonewolf player.

          Requires the excellent Speech Note (harbour-dsnote) by mkiol, and
          will use its engine and settings configured for English.

          %if "0%{?_chum}"
          Title: TTS plugin for Lonewolf
          Type: desktop-application
          Categories:
           - Games
          PackageIcon: %{url}/raw/sfos/rpm/lonewolf-app-icon.svg
          %endif
      Files:
        - '%{_datadir}/%{name}/qml/TTS.qml'
        - '%{_sysconfdir}/sailjail/permissions/%{name}.profile'


